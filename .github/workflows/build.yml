name: XVOX Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build
        shell: bash
        run: |
          # Keep GitHub's check annotations useful when a Kotlin compiler failure occurs. This
          # does not replace the raw log; it surfaces a compact diagnostic on the run summary so
          # a headless verification pass can identify the exact source line without local builds.
          set +e
          ./gradlew :app:assembleRelease 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *"e: "*|*"error: "*|*"FAILURE: Build failed"*|*"What went wrong"*|*"Execution failed"*)
                  safe=${line//'%'/'%25'}
                  safe=${safe//$'\r'/'%0D'}
                  echo "::error title=Gradle build diagnostic::${safe}"
                  ;;
              esac
            done < gradle-build.log
            exit "$status"
          fi

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: XVOX-release
          path: app/build/outputs/apk/release/*.apk
          compression-level: 0
          retention-days: 7
