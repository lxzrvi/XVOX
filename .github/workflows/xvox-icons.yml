# ============================================================
# XVOX ICON CATALOG
# ============================================================
#
# Purpose:
#   Permanent icon manifest for XVOX.
#
# Runtime:
#   This YAML is NOT loaded by the Android app.
#   Selected icons are stored as local Android VectorDrawables:
#
#   app/src/main/res/drawable/ic_xvox_*.xml
#
# Rules:
#   - Prefer Phosphor Icons from one consistent family.
#   - Prefer "fill" for primary music/player actions.
#   - Do not add a full runtime icon-pack dependency.
#   - Keep only icons actually used/planned by XVOX.
#   - Android vectors are tinted using XVOX semantic colors.
#   - Navbar's existing custom XVOX icons remain custom.
#
# ============================================================

catalog:
  name: "XVOX Icons"
  version: 1

source:
  library: "Phosphor Icons"
  website: "https://phosphoricons.com"
  repository: "https://github.com/phosphor-icons/core"
  license: "MIT"

defaults:
  style: "fill"
  android_prefix: "ic_xvox_"
  runtime_dependency: false
  local_vector_drawables: true
  theme_tint: true

android:
  directory: "app/src/main/res/drawable"
  format: "VectorDrawable XML"

