# ============================================================
# DEVELOPMENT RULES
# ============================================================

rules:
  - "Do not replace custom XVOX navigation icons with Phosphor."
  - "Do not hardcode black or white inside runtime icon rendering."
  - "Use XVOX semantic theme colors for tint."
  - "Prefer local VectorDrawable assets over Canvas approximations."
  - "Do not add the entire Phosphor runtime library."
  - "Do not store raster PNG versions when a vector exists."
  - "Keep visual weight consistent within the same control group."
  - "Filled icons are preferred for playback and primary actions."
  - "Bold/regular variants may be used when fill has poor optical balance."
  - "Add future icons to this catalog before introducing random icon styles."
