name: XVOX - Import Missing Phosphor Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-icons:
    name: Import Missing XVOX Icons
    runs-on: ubuntu-latest

    steps:
      - name: Checkout XVOX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Phosphor Core
        uses: actions/checkout@v4
        with:
          repository: phosphor-icons/core
          path: phosphor-core
          fetch-depth: 1

      - name: Generate missing VectorDrawables
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/res/drawable

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys
          import xml.etree.ElementTree as ET

          SOURCE = Path("phosphor-core")
          OUTPUT_DIR = Path("app/src/main/res/drawable")

          ICONS = [
              # Player Controls (Fill & Premium Bold Soft Edges)
              ("play", "fill", "ic_xvox_play.xml"),
              ("pause", "fill", "ic_xvox_pause.xml"),
              ("skip-forward", "fill", "ic_xvox_skip_next.xml"),
              ("skip-back", "fill", "ic_xvox_skip_previous.xml"),
              ("shuffle", "bold", "ic_xvox_shuffle.xml"),
              ("repeat", "bold", "ic_xvox_repeat.xml"),
              ("repeat-once", "bold", "ic_xvox_repeat_one.xml"),

              # Favorites & User Interactions (Fill)
              ("heart", "fill", "ic_xvox_heart.xml"),
              ("heart", "bold", "ic_xvox_heart_outline.xml"),
              ("star", "fill", "ic_xvox_star.xml"),
              ("share-network", "fill", "ic_xvox_share.xml"),
              ("trash", "fill", "ic_xvox_delete.xml"),

              # Navigation & Core Headers (Fill / Bold)
              ("house", "fill", "ic_xvox_home.xml"),
              ("magnifying-glass", "bold", "ic_xvox_search.xml"),
              ("magnifying-glass", "bold", "ic_xvox_search_action.xml"),
              ("gear-six", "fill", "ic_xvox_settings.xml"),
              ("sliders-horizontal", "fill", "ic_xvox_equalizer.xml"),
              ("timer", "fill", "ic_xvox_timer.xml"),

              # Library, Audio & Playlists (Fill)
              ("playlist", "fill", "ic_xvox_playlist.xml"),
              ("queue", "fill", "ic_xvox_queue.xml"),
              ("music-notes", "fill", "ic_xvox_music_note.xml"),
              ("waveform", "bold", "ic_xvox_waveform.xml"),
              ("disc", "fill", "ic_xvox_disc.xml"),
              ("folder-simple", "fill", "ic_xvox_folder.xml"),

              # Volume Controls (Fill)
              ("speaker-high", "fill", "ic_xvox_volume_high.xml"),
              ("speaker-low", "fill", "ic_xvox_volume_low.xml"),
              ("speaker-slash", "fill", "ic_xvox_mute.xml"),

              # Lyrics & Text (Fill / Bold)
              ("text-align-left", "bold", "ic_xvox_lyrics.xml"),
              ("file-plus", "fill", "ic_xvox_lyrics_add.xml"),
              ("file-text", "fill", "ic_xvox_lyrics_file.xml"),
              ("microphone-stage", "fill", "ic_xvox_microphone.xml"),

              # UI Actions & Modals (Bold with Soft Round Edges)
              ("plus", "bold", "ic_xvox_plus.xml"),
              ("plus", "bold", "ic_xvox_add.xml"),
              ("check", "bold", "ic_xvox_check.xml"),
              ("x", "bold", "ic_xvox_close.xml"),
              ("caret-down", "bold", "ic_xvox_collapse.xml"),
              ("caret-right", "bold", "ic_xvox_caret_right.xml"),
              ("arrow-left", "bold", "ic_xvox_arrow_left.xml"),
              ("download-simple", "bold", "ic_xvox_download.xml"),
              ("pencil-simple", "fill", "ic_xvox_edit.xml"),
              ("dots-three-vertical", "bold", "ic_xvox_more.xml"),
              ("info", "fill", "ic_xvox_info.xml"),
              ("arrows-clockwise", "bold", "ic_xvox_refresh.xml"),
              ("arrows-out-simple", "bold", "ic_xvox_fullscreen.xml"),
              ("arrows-in-simple", "bold", "ic_xvox_fullscreen_exit.xml"),
              ("sparkle", "fill", "ic_xvox_sparkle.xml"),
          ]

          def local_name(tag):
              return tag.split("}")[-1]

          def number(value, default=0.0):
              if value is None:
                  return default
              match = re.search(r"-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?", str(value))
              if not match:
                  return default
              try:
                  return float(match.group(0))
              except ValueError:
                  return default

          def fmt(value):
              value = float(value)
              if value.is_integer():
                  return str(int(value))
              return f"{value:.5f}".rstrip("0").rstrip(".")

          def find_svg(icon, weight):
              preferred = [
                  SOURCE / "assets" / weight / f"{icon}-{weight}.svg",
                  SOURCE / "assets" / weight / f"{icon}.svg",
                  SOURCE / "raw" / weight / f"{icon}-{weight}.svg",
                  SOURCE / "raw" / weight / f"{icon}.svg",
              ]
              for path in preferred:
                  if path.exists():
                      return path
              for path in SOURCE.rglob("*.svg"):
                  if path.stem.lower() in {f"{icon}-{weight}".lower(), icon.lower()} and weight in str(path).lower():
                      return path
              return None

          def circle_path(element):
              cx = number(element.attrib.get("cx"))
              cy = number(element.attrib.get("cy"))
              r = number(element.attrib.get("r"))
              if r <= 0:
                  return None
              return f"M {fmt(cx-r)},{fmt(cy)} A {fmt(r)},{fmt(r)} 0 1,0 {fmt(cx+r)},{fmt(cy)} A {fmt(r)},{fmt(r)} 0 1,0 {fmt(cx-r)},{fmt(cy)} Z"

          def ellipse_path(element):
              cx = number(element.attrib.get("cx"))
              cy = number(element.attrib.get("cy"))
              rx = number(element.attrib.get("rx"))
              ry = number(element.attrib.get("ry"))
              if rx <= 0 or ry <= 0:
                  return None
              return f"M {fmt(cx-rx)},{fmt(cy)} A {fmt(rx)},{fmt(ry)} 0 1,0 {fmt(cx+rx)},{fmt(cy)} A {fmt(rx)},{fmt(ry)} 0 1,0 {fmt(cx-rx)},{fmt(cy)} Z"

          def line_path(element):
              x1 = number(element.attrib.get("x1"))
              y1 = number(element.attrib.get("y1"))
              x2 = number(element.attrib.get("x2"))
              y2 = number(element.attrib.get("y2"))
              return f"M {fmt(x1)},{fmt(y1)} L {fmt(x2)},{fmt(y2)}"

          def rect_path(element):
              x = number(element.attrib.get("x"))
              y = number(element.attrib.get("y"))
              width = number(element.attrib.get("width"))
              height = number(element.attrib.get("height"))
              if width <= 0 or height <= 0:
                  return None
              return f"M {fmt(x)},{fmt(y)} H {fmt(x+width)} V {fmt(y+height)} H {fmt(x)} Z"

          def points_path(element, close):
              values = re.findall(r"-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?", element.attrib.get("points", ""))
              if len(values) < 4:
                  return None
              if len(values) % 2:
                  values = values[:-1]
              pairs = []
              for index in range(0, len(values), 2):
                  pairs.append((number(values[index]), number(values[index + 1])))
              data = f"M {fmt(pairs[0][0])},{fmt(pairs[0][1])}"
              for x, y in pairs[1:]:
                  data += f" L {fmt(x)},{fmt(y)}"
              if close:
                  data += " Z"
              return data

          def convert(source, output):
              root = ET.parse(source).getroot()
              viewbox = root.attrib.get("viewBox", "0 0 256 256").replace(",", " ").split()
              if len(viewbox) != 4:
                  raise RuntimeError("Invalid viewBox")

              viewport_width = number(viewbox[2], 256)
              viewport_height = number(viewbox[3], 256)

              vector = ET.Element(
                  "vector",
                  {
                      "xmlns:android": "http://schemas.android.com/apk/res/android",
                      "android:width": "24dp",
                      "android:height": "24dp",
                      "android:viewportWidth": fmt(viewport_width),
                      "android:viewportHeight": fmt(viewport_height),
                  },
              )

              path_count = 0

              def walk(element, inherited=None):
                  nonlocal path_count
                  if inherited is None:
                      inherited = {}
                  style = dict(inherited)
                  for attribute in ("fill", "stroke", "stroke-width", "stroke-linecap", "stroke-linejoin"):
                      if attribute in element.attrib:
                          style[attribute] = element.attrib[attribute]

                  tag = local_name(element.tag)
                  data = None

                  if tag == "path":
                      data = element.attrib.get("d")
                  elif tag == "circle":
                      data = circle_path(element)
                  elif tag == "ellipse":
                      data = ellipse_path(element)
                  elif tag == "line":
                      data = line_path(element)
                  elif tag == "rect":
                      data = rect_path(element)
                  elif tag == "polyline":
                      data = points_path(element, False)
                  elif tag == "polygon":
                      data = points_path(element, True)

                  if data:
                      fill = style.get("fill", "black")
                      stroke = style.get("stroke", "none")
                      if tag == "line":
                          fill = "none"
                          if "stroke" not in style:
                              stroke = "black"

                      attrs = {
                          "android:pathData": data,
                          "android:fillColor": ("#00000000" if fill == "none" else "#FFFFFFFF"),
                      }

                      if stroke != "none":
                          attrs["android:strokeColor"] = "#FFFFFFFF"
                          attrs["android:strokeWidth"] = fmt(number(style.get("stroke-width"), 1))
                          attrs["android:strokeLineCap"] = "round"
                          attrs["android:strokeLineJoin"] = "round"

                      ET.SubElement(vector, "path", attrs)
                      path_count += 1

                  for child in element:
                      walk(child, style)

              walk(root)

              if path_count == 0:
                  raise RuntimeError(f"No convertible geometry in {source}")

              ET.indent(vector, space="    ")
              output.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  + ET.tostring(vector, encoding="unicode")
                  + "\n",
                  encoding="utf-8",
              )
              return path_count

          generated = []

          for icon, weight, filename in ICONS:
              output = OUTPUT_DIR / filename
              source = find_svg(icon, weight)

              if source is None:
                  print(f"{icon} ({weight}) not found", file=sys.stderr)
                  sys.exit(1)

              count = convert(source, output)
              generated.append(output)
              print(f"GENERATED: {output.name} <- {source.name} ({count} paths) [weight: {weight}]")

          if not generated:
              print("All required icons already exist.")
          PY

      - name: Stage generated icons
        shell: bash
        run: |
          set -euo pipefail

          git add app/src/main/res/drawable/ic_xvox_*.xml

          git status --short

      - name: Commit and push icons
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No missing icons to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Import all 46 premium Fill & Bold Phosphor icons"

          git push origin "HEAD:${GITHUB_REF_NAME}"
