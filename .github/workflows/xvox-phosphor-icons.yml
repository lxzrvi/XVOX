name: XVOX - Import Phosphor Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-icons:
    name: Import Phosphor Icons
    runs-on: ubuntu-latest

    steps:
      - name: Checkout XVOX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout official Phosphor Core
        uses: actions/checkout@v4
        with:
          repository: phosphor-icons/core
          path: phosphor-core
          fetch-depth: 1

      - name: Generate Android VectorDrawables
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/res/drawable

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys
          import xml.etree.ElementTree as ET

          SOURCE = Path("phosphor-core")
          OUTPUT = Path("app/src/main/res/drawable")

          ICONS = {
              # Home
              "ic_xvox_refresh": (
                  "arrows-clockwise",
                  "fill",
              ),
              "ic_xvox_heart": (
                  "heart",
                  "fill",
              ),
              "ic_xvox_music_note": (
                  "music-note",
                  "fill",
              ),
              "ic_xvox_playlist": (
                  "playlist",
                  "fill",
              ),

              # Playback
              "ic_xvox_play": (
                  "play",
                  "fill",
              ),
              "ic_xvox_pause": (
                  "pause",
                  "fill",
              ),
              "ic_xvox_skip_previous": (
                  "skip-back",
                  "fill",
              ),
              "ic_xvox_skip_next": (
                  "skip-forward",
                  "fill",
              ),
              "ic_xvox_shuffle": (
                  "shuffle",
                  "fill",
              ),
              "ic_xvox_repeat": (
                  "repeat",
                  "fill",
              ),

              # MiniPlayer/common
              "ic_xvox_add": (
                  "plus",
                  "fill",
              ),
              "ic_xvox_close": (
                  "x",
                  "bold",
              ),
              "ic_xvox_more": (
                  "dots-three",
                  "bold",
              ),

              # Future
              "ic_xvox_search_action": (
                  "magnifying-glass",
                  "bold",
              ),
              "ic_xvox_queue": (
                  "list",
                  "bold",
              ),
              "ic_xvox_equalizer": (
                  "sliders-horizontal",
                  "fill",
              ),
              "ic_xvox_timer": (
                  "timer",
                  "fill",
              ),
              "ic_xvox_volume_high": (
                  "speaker-high",
                  "fill",
              ),
              "ic_xvox_share": (
                  "share-network",
                  "fill",
              ),
              "ic_xvox_delete": (
                  "trash",
                  "fill",
              ),
          }

          def tag_name(tag):
              return tag.split("}")[-1]

          def number(value, default=0.0):
              if value is None:
                  return default

              match = re.search(
                  r"-?(?:\d+(?:\.\d*)?|\.\d+)"
                  r"(?:[eE][+-]?\d+)?",
                  str(value),
              )

              if not match:
                  return default

              try:
                  return float(match.group(0))
              except ValueError:
                  return default

          def fmt(value):
              value = float(value)

              if value.is_integer():
                  return str(int(value))

              return (
                  f"{value:.5f}"
                  .rstrip("0")
                  .rstrip(".")
              )

          def find_svg(icon, weight):
              preferred = [
                  SOURCE /
                  "raw" /
                  weight /
                  f"{icon}-{weight}.svg",

                  SOURCE /
                  "raw" /
                  weight /
                  f"{icon}.svg",

                  SOURCE /
                  "assets" /
                  weight /
                  f"{icon}.svg",
              ]

              for path in preferred:
                  if path.exists():
                      return path

              possibilities = []

              for path in SOURCE.rglob("*.svg"):
                  filename = path.name.lower()

                  if filename not in {
                      f"{icon}.svg".lower(),
                      f"{icon}-{weight}.svg".lower(),
                  }:
                      continue

                  score = 0
                  full = str(path).lower()

                  if weight.lower() in full:
                      score += 100

                  if filename == (
                      f"{icon}-{weight}.svg"
                  ).lower():
                      score += 50

                  possibilities.append(
                      (score, path)
                  )

              if not possibilities:
                  return None

              possibilities.sort(
                  key=lambda pair: pair[0],
                  reverse=True,
              )

              return possibilities[0][1]

          def circle_path(element):
              cx = number(
                  element.attrib.get("cx")
              )
              cy = number(
                  element.attrib.get("cy")
              )
              r = number(
                  element.attrib.get("r")
              )

              if r <= 0:
                  return None

              return (
                  f"M {fmt(cx-r)},{fmt(cy)} "
                  f"A {fmt(r)},{fmt(r)} 0 1,0 "
                  f"{fmt(cx+r)},{fmt(cy)} "
                  f"A {fmt(r)},{fmt(r)} 0 1,0 "
                  f"{fmt(cx-r)},{fmt(cy)} Z"
              )

          def ellipse_path(element):
              cx = number(
                  element.attrib.get("cx")
              )
              cy = number(
                  element.attrib.get("cy")
              )
              rx = number(
                  element.attrib.get("rx")
              )
              ry = number(
                  element.attrib.get("ry")
              )

              if rx <= 0 or ry <= 0:
                  return None

              return (
                  f"M {fmt(cx-rx)},{fmt(cy)} "
                  f"A {fmt(rx)},{fmt(ry)} 0 1,0 "
                  f"{fmt(cx+rx)},{fmt(cy)} "
                  f"A {fmt(rx)},{fmt(ry)} 0 1,0 "
                  f"{fmt(cx-rx)},{fmt(cy)} Z"
              )

          def rect_path(element):
              x = number(
                  element.attrib.get("x")
              )
              y = number(
                  element.attrib.get("y")
              )
              w = number(
                  element.attrib.get("width")
              )
              h = number(
                  element.attrib.get("height")
              )

              if w <= 0 or h <= 0:
                  return None

              rx = number(
                  element.attrib.get("rx")
              )
              ry = number(
                  element.attrib.get("ry")
              )

              if rx <= 0 and ry > 0:
                  rx = ry

              if ry <= 0 and rx > 0:
                  ry = rx

              if rx <= 0 or ry <= 0:
                  return (
                      f"M {fmt(x)},{fmt(y)} "
                      f"H {fmt(x+w)} "
                      f"V {fmt(y+h)} "
                      f"H {fmt(x)} Z"
                  )

              rx = min(rx, w / 2)
              ry = min(ry, h / 2)

              return (
                  f"M {fmt(x+rx)},{fmt(y)} "
                  f"H {fmt(x+w-rx)} "
                  f"A {fmt(rx)},{fmt(ry)} 0 0,1 "
                  f"{fmt(x+w)},{fmt(y+ry)} "
                  f"V {fmt(y+h-ry)} "
                  f"A {fmt(rx)},{fmt(ry)} 0 0,1 "
                  f"{fmt(x+w-rx)},{fmt(y+h)} "
                  f"H {fmt(x+rx)} "
                  f"A {fmt(rx)},{fmt(ry)} 0 0,1 "
                  f"{fmt(x)},{fmt(y+h-ry)} "
                  f"V {fmt(y+ry)} "
                  f"A {fmt(rx)},{fmt(ry)} 0 0,1 "
                  f"{fmt(x+rx)},{fmt(y)} Z"
              )

          def line_path(element):
              x1 = number(
                  element.attrib.get("x1")
              )
              y1 = number(
                  element.attrib.get("y1")
              )
              x2 = number(
                  element.attrib.get("x2")
              )
              y2 = number(
                  element.attrib.get("y2")
              )

              return (
                  f"M {fmt(x1)},{fmt(y1)} "
                  f"L {fmt(x2)},{fmt(y2)}"
              )

          def points_path(element, close):
              values = re.findall(
                  r"-?(?:\d+(?:\.\d*)?|\.\d+)"
                  r"(?:[eE][+-]?\d+)?",
                  element.attrib.get(
                      "points",
                      "",
                  ),
              )

              if len(values) < 4:
                  return None

              if len(values) % 2 != 0:
                  values = values[:-1]

              pairs = []

              for index in range(
                  0,
                  len(values),
                  2,
              ):
                  pairs.append(
                      (
                          number(
                              values[index]
                          ),
                          number(
                              values[index + 1]
                          ),
                      )
                  )

              data = (
                  f"M "
                  f"{fmt(pairs[0][0])},"
                  f"{fmt(pairs[0][1])}"
              )

              for x, y in pairs[1:]:
                  data += (
                      f" L "
                      f"{fmt(x)},{fmt(y)}"
                  )

              if close:
                  data += " Z"

              return data

          def convert(
              source,
              destination,
          ):
              root = ET.parse(
                  source
              ).getroot()

              raw_viewbox = (
                  root.attrib
                  .get(
                      "viewBox",
                      "0 0 256 256",
                  )
                  .replace(",", " ")
                  .split()
              )

              if len(raw_viewbox) != 4:
                  raise RuntimeError(
                      "invalid viewBox"
                  )

              viewport_width = number(
                  raw_viewbox[2],
                  256,
              )

              viewport_height = number(
                  raw_viewbox[3],
                  256,
              )

              vector = ET.Element(
                  "vector",
                  {
                      "xmlns:android":
                          "http://schemas.android.com/apk/res/android",

                      "android:width":
                          "24dp",

                      "android:height":
                          "24dp",

                      "android:viewportWidth":
                          fmt(viewport_width),

                      "android:viewportHeight":
                          fmt(viewport_height),
                  },
              )

              path_count = 0

              def walk(
                  element,
                  inherited=None,
              ):
                  nonlocal path_count

                  if inherited is None:
                      inherited = {}

                  style = dict(inherited)

                  for key in (
                      "fill",
                      "stroke",
                      "stroke-width",
                      "stroke-linecap",
                      "stroke-linejoin",
                  ):
                      if key in element.attrib:
                          style[key] = (
                              element.attrib[key]
                          )

                  tag = tag_name(
                      element.tag
                  )

                  data = None

                  if tag == "path":
                      data = element.attrib.get(
                          "d"
                      )

                  elif tag == "circle":
                      data = circle_path(
                          element
                      )

                  elif tag == "ellipse":
                      data = ellipse_path(
                          element
                      )

                  elif tag == "rect":
                      data = rect_path(
                          element
                      )

                  elif tag == "line":
                      data = line_path(
                          element
                      )

                  elif tag == "polyline":
                      data = points_path(
                          element,
                          False,
                      )

                  elif tag == "polygon":
                      data = points_path(
                          element,
                          True,
                      )

                  if data:
                      fill = style.get(
                          "fill",
                          "black",
                      )

                      stroke = style.get(
                          "stroke",
                          "none",
                      )

                      if tag == "line":
                          fill = "none"

                          if "stroke" not in style:
                              stroke = "black"

                      attributes = {
                          "android:pathData":
                              data,

                          "android:fillColor":
                              (
                                  "#00000000"
                                  if fill == "none"
                                  else "#FFFFFFFF"
                              ),
                      }

                      if stroke != "none":
                          attributes[
                              "android:strokeColor"
                          ] = "#FFFFFFFF"

                          attributes[
                              "android:strokeWidth"
                          ] = fmt(
                              number(
                                  style.get(
                                      "stroke-width"
                                  ),
                                  1,
                              )
                          )

                          cap = style.get(
                              "stroke-linecap"
                          )

                          join = style.get(
                              "stroke-linejoin"
                          )

                          if cap in {
                              "butt",
                              "round",
                              "square",
                          }:
                              attributes[
                                  "android:strokeLineCap"
                              ] = cap

                          if join in {
                              "miter",
                              "round",
                              "bevel",
                          }:
                              attributes[
                                  "android:strokeLineJoin"
                              ] = join

                      ET.SubElement(
                          vector,
                          "path",
                          attributes,
                      )

                      path_count += 1

                  for child in element:
                      walk(
                          child,
                          style,
                      )

              walk(root)

              if path_count == 0:
                  raise RuntimeError(
                      "no drawable geometry"
                  )

              ET.indent(
                  vector,
                  space="    ",
              )

              destination.write_text(
                  '<?xml version="1.0" '
                  'encoding="utf-8"?>\n'
                  +
                  ET.tostring(
                      vector,
                      encoding="unicode",
                  )
                  +
                  "\n",
                  encoding="utf-8",
              )

              return path_count

          failures = []
          generated = []

          for android_name, (
              phosphor_name,
              weight,
          ) in ICONS.items():

              source = find_svg(
                  phosphor_name,
                  weight,
              )

              if source is None:
                  failures.append(
                      f"{phosphor_name} "
                      f"({weight}): "
                      f"source SVG not found"
                  )
                  continue

              destination = (
                  OUTPUT /
                  f"{android_name}.xml"
              )

              try:
                  count = convert(
                      source,
                      destination,
                  )

                  generated.append(
                      destination
                  )

                  print(
                      "GENERATED:",
                      destination,
                      "<-",
                      source,
                      f"({count} paths)",
                  )

              except Exception as error:
                  failures.append(
                      f"{phosphor_name}: "
                      f"{error}"
                  )

          print()
          print(
              f"Generated "
              f"{len(generated)} "
              f"icons."
          )

          if failures:
              print(
                  "Failures:",
                  file=sys.stderr,
              )

              for failure in failures:
                  print(
                      " -",
                      failure,
                      file=sys.stderr,
                  )

              sys.exit(1)

          if not generated:
              print(
                  "ERROR: no icons generated",
                  file=sys.stderr,
              )
              sys.exit(1)

          PY

      - name: Verify generated files exist
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated files:"
          echo

          find \
            app/src/main/res/drawable \
            -maxdepth 1 \
            -type f \
            -name 'ic_xvox_*.xml' \
            -print \
            | sort

          echo
          echo "Git status BEFORE staging:"
          git status --short

      - name: Stage generated icons
        shell: bash
        run: |
          set -euo pipefail

          git add \
            app/src/main/res/drawable/ic_xvox_*.xml

          echo "Git status AFTER staging:"
          git status --short

      - name: Commit and push generated icons
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No generated icon changes."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Import XVOX Phosphor icons"

          echo
          echo "Current workflow branch:"
          echo "${GITHUB_REF_NAME}"

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"

          echo
          echo "Icons pushed successfully."
