name: XVOX - Import Phosphor Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-icons:
    name: Import Phosphor Icons
    runs-on: ubuntu-latest

    steps:
      - name: Checkout XVOX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Phosphor Core
        uses: actions/checkout@v4
        with:
          repository: phosphor-icons/core
          path: phosphor-core
          fetch-depth: 1

      - name: Prepare drawable directory
        run: |
          mkdir -p app/src/main/res/drawable

      - name: Convert selected Phosphor icons
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys
          import xml.etree.ElementTree as ET


          # ============================================================
          # PATHS
          # ============================================================

          PHOSPHOR_ROOT = Path("phosphor-core")

          OUTPUT_ROOT = Path(
              "app/src/main/res/drawable"
          )

          OUTPUT_ROOT.mkdir(
              parents=True,
              exist_ok=True,
          )


          # ============================================================
          # XVOX ICON CATALOG
          # ============================================================
          #
          # Future icon:
          #
          # "ic_xvox_name": ("phosphor-name", "fill"),
          #
          # Then manually run this workflow again.
          #
          # Existing custom navbar icons are intentionally NOT here.
          # ============================================================

          ICONS = {
              # --------------------------------------------------------
              # HOME
              # --------------------------------------------------------

              "ic_xvox_refresh": (
                  "arrows-clockwise",
                  "fill",
              ),

              "ic_xvox_heart": (
                  "heart",
                  "fill",
              ),

              "ic_xvox_music_note": (
                  "music-note",
                  "fill",
              ),

              "ic_xvox_playlist": (
                  "playlist",
                  "fill",
              ),


              # --------------------------------------------------------
              # PLAYBACK
              # --------------------------------------------------------

              "ic_xvox_play": (
                  "play",
                  "fill",
              ),

              "ic_xvox_pause": (
                  "pause",
                  "fill",
              ),

              "ic_xvox_skip_previous": (
                  "skip-back",
                  "fill",
              ),

              "ic_xvox_skip_next": (
                  "skip-forward",
                  "fill",
              ),

              "ic_xvox_shuffle": (
                  "shuffle",
                  "fill",
              ),

              "ic_xvox_repeat": (
                  "repeat",
                  "fill",
              ),


              # --------------------------------------------------------
              # MINIPLAYER / COMMON
              # --------------------------------------------------------

              "ic_xvox_add": (
                  "plus",
                  "fill",
              ),

              "ic_xvox_close": (
                  "x",
                  "bold",
              ),

              "ic_xvox_more": (
                  "dots-three",
                  "bold",
              ),


              # --------------------------------------------------------
              # FUTURE
              # --------------------------------------------------------

              "ic_xvox_search_action": (
                  "magnifying-glass",
                  "bold",
              ),

              "ic_xvox_queue": (
                  "list",
                  "bold",
              ),

              "ic_xvox_equalizer": (
                  "sliders-horizontal",
                  "fill",
              ),

              "ic_xvox_timer": (
                  "timer",
                  "fill",
              ),

              "ic_xvox_volume_high": (
                  "speaker-high",
                  "fill",
              ),

              "ic_xvox_share": (
                  "share-network",
                  "fill",
              ),

              "ic_xvox_delete": (
                  "trash",
                  "fill",
              ),
          }


          # ============================================================
          # HELPERS
          # ============================================================

          def local_name(tag):
              return tag.split("}")[-1]


          def number(value, default=0.0):
              if value is None:
                  return default

              match = re.search(
                  r"-?(?:\d+(?:\.\d*)?|\.\d+)"
                  r"(?:[eE][+-]?\d+)?",
                  str(value),
              )

              if not match:
                  return default

              try:
                  return float(match.group(0))
              except ValueError:
                  return default


          def fmt(value):
              value = float(value)

              if value.is_integer():
                  return str(int(value))

              return (
                  f"{value:.5f}"
                  .rstrip("0")
                  .rstrip(".")
              )


          def find_svg(icon_name, weight):
              preferred = [
                  PHOSPHOR_ROOT
                  / "assets"
                  / weight
                  / f"{icon_name}.svg",

                  PHOSPHOR_ROOT
                  / "raw"
                  / weight
                  / f"{icon_name}-{weight}.svg",

                  PHOSPHOR_ROOT
                  / "raw"
                  / weight
                  / f"{icon_name}.svg",
              ]

              for path in preferred:
                  if path.exists():
                      return path

              matches = []

              expected_names = {
                  f"{icon_name}.svg",
                  f"{icon_name}-{weight}.svg",
              }

              for path in PHOSPHOR_ROOT.rglob("*.svg"):
                  lower_name = path.name.lower()

                  if lower_name not in {
                      name.lower()
                      for name in expected_names
                  }:
                      continue

                  full = str(path).lower()

                  score = 0

                  if weight.lower() in full:
                      score += 100

                  if (
                      lower_name ==
                      f"{icon_name}-{weight}.svg".lower()
                  ):
                      score += 50

                  if (
                      lower_name ==
                      f"{icon_name}.svg".lower()
                  ):
                      score += 25

                  matches.append(
                      (score, path)
                  )

              if not matches:
                  return None

              matches.sort(
                  key=lambda entry: (
                      entry[0],
                      -len(str(entry[1])),
                  ),
                  reverse=True,
              )

              return matches[0][1]


          # ============================================================
          # SVG STYLE
          # ============================================================

          def is_none(value):
              return (
                  str(value)
                  .strip()
                  .lower()
                  == "none"
              )


          def inherited_attr(
              element,
              inherited,
              name,
              default=None,
          ):
              if name in element.attrib:
                  return element.attrib[name]

              return inherited.get(
                  name,
                  default,
              )


          # ============================================================
          # VECTOR BUILDER
          # ============================================================

          class VectorBuilder:

              def __init__(
                  self,
                  viewport_width,
                  viewport_height,
              ):
                  self.root = ET.Element(
                      "vector",
                      {
                          "xmlns:android":
                              "http://schemas.android.com/apk/res/android",

                          "android:width":
                              "24dp",

                          "android:height":
                              "24dp",

                          "android:viewportWidth":
                              fmt(viewport_width),

                          "android:viewportHeight":
                              fmt(viewport_height),
                      },
                  )

                  self.count = 0


              def add_path(
                  self,
                  path_data,
                  fill,
                  stroke,
                  stroke_width,
                  line_cap,
                  line_join,
              ):
                  attributes = {
                      "android:pathData":
                          path_data,
                  }

                  if fill:
                      attributes[
                          "android:fillColor"
                      ] = "#FFFFFFFF"

                  else:
                      attributes[
                          "android:fillColor"
                      ] = "#00000000"

                  if stroke:
                      attributes[
                          "android:strokeColor"
                      ] = "#FFFFFFFF"

                      attributes[
                          "android:strokeWidth"
                      ] = fmt(
                          stroke_width
                      )

                      if line_cap in {
                          "butt",
                          "round",
                          "square",
                      }:
                          attributes[
                              "android:strokeLineCap"
                          ] = line_cap

                      if line_join in {
                          "miter",
                          "round",
                          "bevel",
                      }:
                          attributes[
                              "android:strokeLineJoin"
                          ] = line_join

                  ET.SubElement(
                      self.root,
                      "path",
                      attributes,
                  )

                  self.count += 1


          # ============================================================
          # PRIMITIVE -> PATH
          # ============================================================

          def circle_path(element):
              cx = number(
                  element.attrib.get("cx")
              )

              cy = number(
                  element.attrib.get("cy")
              )

              radius = number(
                  element.attrib.get("r")
              )

              if radius <= 0:
                  return None

              return (
                  f"M {fmt(cx - radius)},{fmt(cy)} "
                  f"A {fmt(radius)},{fmt(radius)} "
                  f"0 1,0 "
                  f"{fmt(cx + radius)},{fmt(cy)} "
                  f"A {fmt(radius)},{fmt(radius)} "
                  f"0 1,0 "
                  f"{fmt(cx - radius)},{fmt(cy)} "
                  f"Z"
              )


          def ellipse_path(element):
              cx = number(
                  element.attrib.get("cx")
              )

              cy = number(
                  element.attrib.get("cy")
              )

              rx = number(
                  element.attrib.get("rx")
              )

              ry = number(
                  element.attrib.get("ry")
              )

              if rx <= 0 or ry <= 0:
                  return None

              return (
                  f"M {fmt(cx - rx)},{fmt(cy)} "
                  f"A {fmt(rx)},{fmt(ry)} "
                  f"0 1,0 "
                  f"{fmt(cx + rx)},{fmt(cy)} "
                  f"A {fmt(rx)},{fmt(ry)} "
                  f"0 1,0 "
                  f"{fmt(cx - rx)},{fmt(cy)} "
                  f"Z"
              )


          def line_path(element):
              x1 = number(
                  element.attrib.get("x1")
              )

              y1 = number(
                  element.attrib.get("y1")
              )

              x2 = number(
                  element.attrib.get("x2")
              )

              y2 = number(
                  element.attrib.get("y2")
              )

              return (
                  f"M {fmt(x1)},{fmt(y1)} "
                  f"L {fmt(x2)},{fmt(y2)}"
              )


          def rect_path(element):
              x = number(
                  element.attrib.get("x")
              )

              y = number(
                  element.attrib.get("y")
              )

              width = number(
                  element.attrib.get("width")
              )

              height = number(
                  element.attrib.get("height")
              )

              if width <= 0 or height <= 0:
                  return None

              rx = number(
                  element.attrib.get("rx")
              )

              ry = number(
                  element.attrib.get("ry")
              )

              if rx <= 0 and ry > 0:
                  rx = ry

              if ry <= 0 and rx > 0:
                  ry = rx

              rx = min(
                  rx,
                  width / 2,
              )

              ry = min(
                  ry,
                  height / 2,
              )

              if rx <= 0 or ry <= 0:
                  return (
                      f"M {fmt(x)},{fmt(y)} "
                      f"H {fmt(x + width)} "
                      f"V {fmt(y + height)} "
                      f"H {fmt(x)} "
                      f"Z"
                  )

              return (
                  f"M {fmt(x + rx)},{fmt(y)} "
                  f"H {fmt(x + width - rx)} "
                  f"A {fmt(rx)},{fmt(ry)} "
                  f"0 0,1 "
                  f"{fmt(x + width)},"
                  f"{fmt(y + ry)} "

                  f"V {fmt(y + height - ry)} "
                  f"A {fmt(rx)},{fmt(ry)} "
                  f"0 0,1 "
                  f"{fmt(x + width - rx)},"
                  f"{fmt(y + height)} "

                  f"H {fmt(x + rx)} "
                  f"A {fmt(rx)},{fmt(ry)} "
                  f"0 0,1 "
                  f"{fmt(x)},"
                  f"{fmt(y + height - ry)} "

                  f"V {fmt(y + ry)} "
                  f"A {fmt(rx)},{fmt(ry)} "
                  f"0 0,1 "
                  f"{fmt(x + rx)},"
                  f"{fmt(y)} "
                  f"Z"
              )


          def points_path(element, close):
              raw = element.attrib.get(
                  "points",
                  "",
              )

              values = re.findall(
                  r"-?(?:\d+(?:\.\d*)?|\.\d+)"
                  r"(?:[eE][+-]?\d+)?",
                  raw,
              )

              if len(values) < 4:
                  return None

              if len(values) % 2 != 0:
                  values = values[:-1]

              points = []

              for index in range(
                  0,
                  len(values),
                  2,
              ):
                  points.append(
                      (
                          number(values[index]),
                          number(
                              values[
                                  index + 1
                              ]
                          ),
                      )
                  )

              if not points:
                  return None

              data = (
                  f"M "
                  f"{fmt(points[0][0])},"
                  f"{fmt(points[0][1])}"
              )

              for x, y in points[1:]:
                  data += (
                      f" L "
                      f"{fmt(x)},"
                      f"{fmt(y)}"
                  )

              if close:
                  data += " Z"

              return data


          # ============================================================
          # TREE WALK
          # ============================================================

          DRAWABLE_TAGS = {
              "path",
              "circle",
              "ellipse",
              "rect",
              "line",
              "polyline",
              "polygon",
          }


          def walk(
              element,
              builder,
              inherited=None,
          ):
              if inherited is None:
                  inherited = {}

              current = dict(
                  inherited
              )

              for attribute in [
                  "fill",
                  "stroke",
                  "stroke-width",
                  "stroke-linecap",
                  "stroke-linejoin",
              ]:
                  if attribute in element.attrib:
                      current[attribute] = (
                          element.attrib[
                              attribute
                          ]
                      )

              tag = local_name(
                  element.tag
              )

              path_data = None

              if tag == "path":
                  path_data = (
                      element.attrib.get(
                          "d"
                      )
                  )

              elif tag == "circle":
                  path_data = circle_path(
                      element
                  )

              elif tag == "ellipse":
                  path_data = ellipse_path(
                      element
                  )

              elif tag == "rect":
                  path_data = rect_path(
                      element
                  )

              elif tag == "line":
                  path_data = line_path(
                      element
                  )

              elif tag == "polyline":
                  path_data = points_path(
                      element,
                      close=False,
                  )

              elif tag == "polygon":
                  path_data = points_path(
                      element,
                      close=True,
                  )

              if (
                  tag in DRAWABLE_TAGS
                  and path_data
              ):
                  fill_value = inherited_attr(
                      element,
                      current,
                      "fill",
                      "black",
                  )

                  stroke_value = inherited_attr(
                      element,
                      current,
                      "stroke",
                      "none",
                  )

                  fill_enabled = not is_none(
                      fill_value
                  )

                  stroke_enabled = not is_none(
                      stroke_value
                  )

                  # Lines/polyline normally rely on stroke.
                  if tag == "line":
                      fill_enabled = False

                      if "stroke" not in current:
                          stroke_enabled = True

                  builder.add_path(
                      path_data =
                          path_data,

                      fill =
                          fill_enabled,

                      stroke =
                          stroke_enabled,

                      stroke_width =
                          number(
                              current.get(
                                  "stroke-width"
                              ),
                              1.0,
                          ),

                      line_cap =
                          current.get(
                              "stroke-linecap"
                          ),

                      line_join =
                          current.get(
                              "stroke-linejoin"
                          ),
                  )

              for child in element:
                  walk(
                      child,
                      builder,
                      current,
                  )


          # ============================================================
          # SVG -> VECTOR
          # ============================================================

          def convert_svg(
              source,
              destination,
          ):
              tree = ET.parse(
                  source
              )

              root = tree.getroot()

              view_box = (
                  root.attrib
                  .get(
                      "viewBox",
                      "0 0 256 256",
                  )
                  .replace(
                      ",",
                      " ",
                  )
                  .split()
              )

              if len(view_box) != 4:
                  raise RuntimeError(
                      "Invalid SVG viewBox"
                  )

              min_x = number(
                  view_box[0]
              )

              min_y = number(
                  view_box[1]
              )

              viewport_width = number(
                  view_box[2],
                  256.0,
              )

              viewport_height = number(
                  view_box[3],
                  256.0,
              )

              if (
                  viewport_width <= 0
                  or viewport_height <= 0
              ):
                  raise RuntimeError(
                      "Invalid viewport size"
                  )

              if (
                  min_x != 0
                  or min_y != 0
              ):
                  print(
                      "WARNING: "
                      f"{source} has non-zero "
                      f"viewBox origin "
                      f"({min_x}, {min_y})"
                  )

              builder = VectorBuilder(
                  viewport_width,
                  viewport_height,
              )

              walk(
                  root,
                  builder,
              )

              if builder.count == 0:
                  raise RuntimeError(
                      "No convertible paths found"
                  )

              try:
                  ET.indent(
                      builder.root,
                      space="    ",
                  )
              except AttributeError:
                  pass

              xml = ET.tostring(
                  builder.root,
                  encoding="unicode",
              )

              destination.write_text(
                  '<?xml version="1.0" '
                  'encoding="utf-8"?>\n'
                  + xml
                  + "\n",
                  encoding="utf-8",
              )

              return builder.count


          # ============================================================
          # IMPORT
          # ============================================================

          failures = []
          generated = []

          print(
              "\n"
              "============================================"
          )

          print(
              "XVOX PHOSPHOR IMPORT"
          )

          print(
              "============================================"
          )

          for android_name, (
              phosphor_name,
              weight,
          ) in ICONS.items():

              source = find_svg(
                  phosphor_name,
                  weight,
              )

              if source is None:
                  failures.append(
                      f"{android_name}: "
                      f"could not locate "
                      f"{phosphor_name} "
                      f"({weight})"
                  )

                  continue

              destination = (
                  OUTPUT_ROOT /
                  f"{android_name}.xml"
              )

              try:
                  path_count = convert_svg(
                      source,
                      destination,
                  )

                  generated.append(
                      destination
                  )

                  print(
                      f"OK  "
                      f"{phosphor_name} "
                      f"[{weight}] "
                      f"-> "
                      f"{destination} "
                      f"({path_count} paths)"
                  )

              except Exception as error:
                  failures.append(
                      f"{android_name}: "
                      f"{source}: "
                      f"{error}"
                  )

          print(
              "\n"
              "============================================"
          )

          print(
              f"Generated: "
              f"{len(generated)}"
          )

          print(
              f"Failures: "
              f"{len(failures)}"
          )

          print(
              "============================================"
          )

          if failures:
              print(
                  "\nFailed icons:",
                  file=sys.stderr,
              )

              for failure in failures:
                  print(
                      f" - {failure}",
                      file=sys.stderr,
                  )

              sys.exit(1)

          PY

      - name: Validate generated VectorDrawables
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated XVOX icon files:"
          echo

          find \
            app/src/main/res/drawable \
            -maxdepth 1 \
            -type f \
            -name 'ic_xvox_*.xml' \
            -print \
            | sort

      - name: Commit icons to XVOX
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- app/src/main/res/drawable; then
            echo "Icons are already up to date."
            exit 0
          fi

          git config \
            user.name \
            "xvox-actions"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/res/drawable/ic_xvox_*.xml

          git commit \
            -m "Import XVOX Phosphor icons"

          git push
