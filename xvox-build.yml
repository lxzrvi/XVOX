name: XVOX Build

on:
  push:
    branches:
      - xvox
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --parallel --build-cache --configuration-cache -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" -Dkotlin.incremental=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XVOX-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
